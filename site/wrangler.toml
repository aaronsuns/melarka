# melarka.zexa.se: the Melarka landing page (static assets + worker.js for video ranges). Cloudflare
# account of the zone zexa.se. Deploy: cd site && npx -y wrangler@4 deploy (Node 22).
name = "melarka-site"
main = "worker.js"
compatibility_date = "2026-10-01"
workers_dev = true
routes = [{ pattern = "melarka.zexa.se", custom_domain = true }]

[assets]
directory = "./public"
binding = "ASSETS"
run_worker_first = ["/media/*", "/api/*"]
html_handling = "drop-trailing-slash"

# The opt-in usage ping from Melarka servers (internal/usageping): install id -> version, each key
# expiring 35 days after its last ping, so the key count is the installs active in the last month.
[[kv_namespaces]]
binding = "PINGS"
id = "c2674f47bfbe43f485dd8ba473818c0a"
