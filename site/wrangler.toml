# melarka.zexa.se: the Melarka landing page (static assets + worker.js for video ranges). Cloudflare
# account of the zone zexa.se. Deploy: cd site && npx -y wrangler@4 deploy (Node 22).
name = "melarka-site"
main = "worker.js"
compatibility_date = "2026-10-01"
workers_dev = true
routes = [{ pattern = "melarka.zexa.se", custom_domain = true }]

[assets]
directory = "./public"
binding = "ASSETS"
run_worker_first = ["/media/*"]
html_handling = "drop-trailing-slash"
