name: release

on:
  push:
    tags: ['v*.*.*']
  # A manual run only builds and signs the Android APK of the version in ios/project.yml and keeps it as a
  # workflow artifact; it never publishes anything.
  workflow_dispatch:

permissions: {}

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  IMAGE: ghcr.io/aaronsuns/melarka
  # The iOS project as XcodeGen names it (ios/project.yml), and what the built app must say it is.
  IOS_PROJECT: Lark.xcodeproj
  IOS_SCHEME: Lark
  APP_BUNDLE_ID: io.github.aaronsuns.melarka
  APP_DISPLAY_NAME: Melarka

defaults:
  run:
    shell: bash # bash -eo pipefail

jobs:
  # Nothing is published unless the tag is a plain X.Y.Z with release notes and the gate is clean.
  gate:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      version: ${{ steps.v.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - id: v
        run: |
          v="${GITHUB_REF_NAME#v}"
          [[ "$v" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "tag $GITHUB_REF_NAME is not vX.Y.Z" >&2; exit 1; }
          # F-Droid rebuilds the APK from the tag without -PlarkVersion, so ios/project.yml must say the same
          # version, or its build can't match ours (internal/config/release_test.go checks the rest).
          mv=$(sed -n 's/^ *MARKETING_VERSION: *"\([0-9.]*\)".*/\1/p' ios/project.yml)
          [ "$mv" = "$v" ] || { echo "tag $GITHUB_REF_NAME, but ios/project.yml says MARKETING_VERSION $mv" >&2; exit 1; }
          echo "version=$v" >> "$GITHUB_OUTPUT"
      - run: scripts/changelog-section.sh "${{ steps.v.outputs.version }}" > /dev/null
      - run: scripts/ci-install-gitleaks.sh
      - run: scripts/ci-oss-check.sh # full mode; the denylist is REQUIRED here (no fork exception)
        env:
          OSS_DENYLIST: ${{ secrets.OSS_DENYLIST }}

  image:
    needs: gate
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    env:
      VERSION: ${{ needs.gate.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6
        with:
          images: ${{ env.IMAGE }}
          flavor: latest=false
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest
          labels: org.opencontainers.image.title=Melarka
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: VERSION=${{ needs.gate.outputs.version }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: The pushed image reports the tag's version
        run: |
          got=$(docker run --rm "$IMAGE:$VERSION" --version)
          echo "$got"
          [ "$got" = "melarka $VERSION" ]

  ipa:
    needs: gate
    if: github.event_name == 'push'
    runs-on: macos-latest
    permissions:
      contents: read
    defaults:
      run:
        working-directory: ios
    env:
      VERSION: ${{ needs.gate.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Newest stable Xcode
        run: |
          xcode=$(printf '%s\n' /Applications/Xcode_*.app | grep -viE 'beta|_rc|release' | sort -V | tail -1)
          [ -d "$xcode" ] || { echo "no stable Xcode in /Applications" >&2; exit 1; }
          sudo xcode-select -s "$xcode"
          xcodebuild -version
      - run: brew install xcodegen && xcodegen generate --quiet
      - name: Unsigned archive (CFBundleVersion = CFBundleShortVersionString = the tag's semver)
        run: |
          xcodebuild -project "$IOS_PROJECT" -scheme "$IOS_SCHEME" -configuration Release \
            -destination generic/platform=iOS -archivePath build/App.xcarchive -quiet archive \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" \
            MARKETING_VERSION="$VERSION" CURRENT_PROJECT_VERSION="$VERSION"
      - name: Package Melarka-X.Y.Z.ipa and check what it says it is
        run: |
          shopt -s nullglob
          apps=(build/App.xcarchive/Products/Applications/*.app)
          [ ${#apps[@]} = 1 ] || { echo "expected one .app, found ${#apps[@]}" >&2; exit 1; }
          mkdir -p build/ipa/Payload && cp -R "${apps[0]}" build/ipa/Payload/
          p="build/ipa/Payload/$(basename "${apps[0]}")/Info.plist"
          check() { got=$(/usr/libexec/PlistBuddy -c "Print $1" "$p"); echo "$1=$got"
                    [ "$got" = "$2" ] || { echo "$1 is '$got', want '$2'" >&2; exit 1; }; }
          check CFBundleIdentifier "$APP_BUNDLE_ID"
          check CFBundleDisplayName "$APP_DISPLAY_NAME"
          check CFBundleShortVersionString "$VERSION"
          check CFBundleVersion "$VERSION"
          (cd build/ipa && zip -qry "../Melarka-$VERSION.ipa" Payload)
          ls -l "build/Melarka-$VERSION.ipa"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: ipa
          path: ios/build/Melarka-${{ needs.gate.outputs.version }}.ipa
          if-no-files-found: error

  # The signed Android APK. The key is a repository secret, decoded to a temporary file for this job only. Run by
  # hand (Actions -> release -> Run workflow) it builds the APK of the version in ios/project.yml and
  # keeps it as a workflow artifact; nothing is published.
  apk:
    needs: gate
    # A tag push waits for a clean gate; a manual run has no gate.
    if: ${{ !cancelled() && (github.event_name == 'workflow_dispatch' || needs.gate.result == 'success') }}
    runs-on: ubuntu-latest
    # The signing secrets are environment secrets of `release`, limited to v* tags and main (docs/superpowers/specs/android-client-design.md).
    environment: release
    permissions:
      contents: read
    env:
      GATE_VERSION: ${{ needs.gate.outputs.version }}
      APK_CERT_FILE: android/signing-cert.sha256
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-java@c1e323688fd81a25caa38c78aa6df2d33d3e20d9 # v4.8.0
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@4d9f0ba0025fe599b4ebab900eb7f3a1d93ef4c2 # v5.0.0
      - id: v
        name: The version (the tag's, or ios/project.yml's for a manual run) and its versionCode
        run: |
          v="$GATE_VERSION"
          [ -n "$v" ] || v=$(sed -n 's/^ *MARKETING_VERSION: *"\([0-9.]*\)".*/\1/p' ios/project.yml)
          [[ "$v" =~ ^([0-9]+)\.([0-9]+)\.([0-9]+)$ ]] || { echo "version '$v' is not X.Y.Z" >&2; exit 1; }
          code=$(( BASH_REMATCH[1] * 10000 + BASH_REMATCH[2] * 100 + BASH_REMATCH[3] ))
          echo "version=$v" >> "$GITHUB_OUTPUT"
          echo "code=$code" >> "$GITHUB_OUTPUT"
      - name: Signed release APK
        working-directory: android
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_B64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          VERSION: ${{ steps.v.outputs.version }}
        run: |
          for n in KEYSTORE_B64 ANDROID_KEYSTORE_PASSWORD ANDROID_KEY_ALIAS ANDROID_KEY_PASSWORD; do
            [ -n "${!n}" ] || { echo "the $n secret is missing or empty (environment 'release')" >&2; exit 1; }
          done
          export ANDROID_KEYSTORE_FILE="$RUNNER_TEMP/melarka-release.jks"
          trap 'rm -f "$ANDROID_KEYSTORE_FILE"' EXIT
          (umask 077; printf '%s' "$KEYSTORE_B64" | base64 -d > "$ANDROID_KEYSTORE_FILE")
          # No daemon: it would keep the passwords in its environment after the step.
          ./gradlew --console=plain --no-daemon assembleRelease -PlarkVersion="$VERSION"
      - name: Remove the keystore file
        if: always()
        run: rm -f "$RUNNER_TEMP/melarka-release.jks"
      - name: The APK is signed with the release key and says what it should
        env:
          VERSION: ${{ steps.v.outputs.version }}
          CODE: ${{ steps.v.outputs.code }}
        run: |
          tools=$(printf '%s\n' "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)
          src=android/app/build/outputs/apk/release/app-release.apk
          mkdir -p dist && cp "$src" "dist/Melarka-$VERSION.apk"
          apk="dist/Melarka-$VERSION.apk"
          "$tools/apksigner" verify --print-certs "$apk" > "$RUNNER_TEMP/certs.txt"
          cat "$RUNNER_TEMP/certs.txt"
          # Older apksigner prints "Signer #1 certificate …", newer one line per scheme
          # ("V2 Signer: certificate …"); the same certificate in several schemes counts once.
          got=$(sed -nE 's/^(Signer #[0-9]+|V[0-9.]+ Signer):? certificate SHA-256 digest: //p' "$RUNNER_TEMP/certs.txt" | sort -u)
          want=$(tr -d '[:space:]' < "$APK_CERT_FILE")
          [ -n "$got" ] && [ "$(printf '%s\n' "$got" | wc -l)" = 1 ] || { echo "expected exactly one signer certificate" >&2; exit 1; }
          [ "$got" = "$want" ] || { echo "signed with $got, want $want ($APK_CERT_FILE)" >&2; exit 1; }
          "$tools/aapt2" dump badging "$apk" > "$RUNNER_TEMP/badging.txt"
          line=$(head -1 "$RUNNER_TEMP/badging.txt")
          echo "$line"
          for part in "name='$APP_BUNDLE_ID'" "versionCode='$CODE'" "versionName='$VERSION'"; do
            [[ "$line" == *"$part"* ]] || { echo "badging lacks $part" >&2; exit 1; }
          done
          grep -q "^application-label:'$APP_DISPLAY_NAME'" "$RUNNER_TEMP/badging.txt"
          ls -l "$apk"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: apk
          path: dist/Melarka-${{ steps.v.outputs.version }}.apk
          if-no-files-found: error

  release:
    needs: [gate, image, ipa, apk]
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      VERSION: ${{ needs.gate.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          pattern: '{ipa,apk}'
          path: dist
          merge-multiple: true
      - run: scripts/changelog-section.sh "$VERSION" > "$RUNNER_TEMP/notes.md"
      - uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3
        with:
          tag_name: ${{ github.ref_name }}
          name: Melarka ${{ needs.gate.outputs.version }}
          body_path: ${{ runner.temp }}/notes.md
          files: |
            dist/Melarka-${{ needs.gate.outputs.version }}.ipa
            dist/Melarka-${{ needs.gate.outputs.version }}.apk
          fail_on_unmatched_files: true

  # A release made with GITHUB_TOKEN does not trigger other workflows, so Pages is called from here.
  # pages.yml skips itself while the repository is private.
  pages:
    needs: release
    if: github.event_name == 'push'
    permissions:
      contents: read
      pages: write
      id-token: write
    uses: ./.github/workflows/pages.yml
