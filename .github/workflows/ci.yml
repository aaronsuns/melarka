name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions: {}

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# The iOS project as XcodeGen names it (ios/project.yml). Change these here if the project or scheme is renamed.
env:
  IOS_PROJECT: Lark.xcodeproj
  IOS_SCHEME: Lark

defaults:
  run:
    shell: bash # bash -eo pipefail: a failing command before a pipe fails the step

jobs:
  changes:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    # A force-push's "before" commit is gone, so there is nothing to diff against: run everything.
    outputs:
      ios: ${{ github.event.forced && 'true' || steps.f.outputs.ios }}
      docker: ${{ github.event.forced && 'true' || steps.f.outputs.docker }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        if: ${{ !github.event.forced }}
        with:
          persist-credentials: false
      - uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4
        if: ${{ !github.event.forced }}
        id: f
        with:
          filters: |
            ios:
              - 'ios/**'
              - '.github/workflows/ci.yml'
            docker:
              - 'Dockerfile'
              - '.dockerignore'
              - '.github/workflows/ci.yml'
              - '.github/workflows/release.yml'

  go:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version: '1.26'
      - id: distro # the .deb cache is per Ubuntu release
        run: . /etc/os-release && echo "id=$ID-$VERSION_ID" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ffmpeg-debs
          key: ffmpeg-debs-v1-${{ steps.distro.outputs.id }}-${{ runner.arch }}
      - run: scripts/ci-install-ffmpeg.sh
        env:
          DEB_CACHE: ~/.cache/ffmpeg-debs
      - run: go vet ./...
      - run: go test ./...
      - run: go test -race ./internal/stream/... ./internal/download/... ./internal/channels/... ./internal/personal/... ./internal/loudness/...

  web:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm run build

  e2e:
    needs: web
    runs-on: ubuntu-latest
    permissions:
      contents: read
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version: '1.26'
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: web/package-lock.json
      - id: distro # the .deb cache is per Ubuntu release
        run: . /etc/os-release && echo "id=$ID-$VERSION_ID" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ffmpeg-debs
          key: ffmpeg-debs-v1-${{ steps.distro.outputs.id }}-${{ runner.arch }}
      - run: ../scripts/ci-install-ffmpeg.sh
        env:
          DEB_CACHE: ~/.cache/ffmpeg-debs
      - run: npm ci
      - run: npx playwright install --with-deps webkit chromium
      - run: npm run build
      - run: npm run e2e # the test server uses web/e2e/fake-yt-dlp.sh: no network
      - name: TEMP the whole e2e suite 3 more times, each on a fresh server
        run: for i in 1 2 3; do echo "== e2e round $i"; npm run e2e || exit 1; done
      - name: TEMP keep the failed tests' traces
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: e2e-test-results
          path: web/test-results
          retention-days: 3

  image:
    needs: [go, web]
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - run: docker build --build-arg VERSION=ci -t melarka:ci .
      - run: |
          got=$(docker run --rm melarka:ci --version)
          echo "$got"
          [ "$got" = "melarka ci" ]

  # Both release platforms, no push: proves the per-architecture yt-dlp checksums before a tag needs them.
  image-multiarch:
    needs: changes
    if: needs.changes.outputs.docker == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: false
          build-args: VERSION=ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

  ios:
    needs: changes
    if: needs.changes.outputs.ios == 'true'
    runs-on: macos-latest
    permissions:
      contents: read
    defaults:
      run:
        working-directory: ios
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Newest stable Xcode
        run: |
          xcode=$(printf '%s\n' /Applications/Xcode_*.app | grep -viE 'beta|_rc|release' | sort -V | tail -1)
          [ -d "$xcode" ] || { echo "no stable Xcode in /Applications" >&2; exit 1; }
          sudo xcode-select -s "$xcode"
          xcodebuild -version
      - run: brew install xcodegen && xcodegen generate --quiet
      - name: Unit tests on the newest iPhone simulator
        run: |
          udid=$(xcrun simctl list devices available -j | python3 -c '
          import json, re, sys
          best = None
          for key, devs in json.load(sys.stdin)["devices"].items():
              m = re.search(r"SimRuntime\.iOS-(\d+)-(\d+)(?:-(\d+))?$", key)
              phones = [d for d in devs if d.get("isAvailable", True) and d["name"].startswith("iPhone")]
              if m and phones:
                  ver = tuple(int(x or 0) for x in m.groups())
                  if best is None or ver > best[0]:
                      best = (ver, phones[-1])
          if best is None:
              sys.exit("no available iPhone simulator")
          sys.stderr.write("simulator: %s, iOS %s\n" % (best[1]["name"], ".".join(map(str, best[0]))))
          print(best[1]["udid"])
          ')
          echo "SIM_UDID=$udid" >> "$GITHUB_ENV"
          xcodebuild test -project "$IOS_PROJECT" -scheme "$IOS_SCHEME" -destination "id=$udid" \
            -derivedDataPath build/dd -quiet
      - name: TEMP stress the flaky iOS tests
        if: always()
        run: |
          set +e
          stress() {
            xcodebuild test-without-building -project "$IOS_PROJECT" -scheme "$IOS_SCHEME" -destination "id=$SIM_UDID" \
              -derivedDataPath build/dd "$@" > stress.log 2>&1
            local rc=$?; echo "xcodebuild exit $rc"; [ $rc -eq 0 ] || bad=1
            grep -E "error: -\[|' failed \(" stress.log | sort | uniq -c | sort -rn | head -40
            echo "passed: $(grep -cE "' passed \(" stress.log)  failed: $(grep -cE "' failed \(" stress.log)"
          }
          bad=0
          echo "== the whole suite, 5 times"
          stress -test-iterations 5
          echo "== the two flaky classes, 30 times, relaunched each time"
          stress -only-testing:LarkTests/AVPlayerBackendTests -only-testing:LarkTests/BridgeWebViewTests \
            -test-iterations 30 -test-repetition-relaunch-enabled YES
          exit $bad
      - run: python3 -m unittest discover -s scripts

  # Release gate: gitleaks over the full history + the private denylist (repository secret OSS_DENYLIST).
  # Fails closed everywhere except pull requests from forks, which get no secrets.
  oss-check:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - run: scripts/ci-install-gitleaks.sh
      - run: scripts/test_oss_check.sh && scripts/test_changelog_section.sh
      - run: scripts/ci-oss-check.sh
        env:
          OSS_DENYLIST: ${{ secrets.OSS_DENYLIST }}
          OSS_FORK_PR: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.fork == true }}
