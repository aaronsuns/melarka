name: Lark
options:
  bundleIdPrefix: io.github.aaronsuns
  developmentLanguage: en           # native screens, intents and Siri phrases follow the phone: zh-Hans/zh-Hant phones get Chinese, all others English
  deploymentTarget: { iOS: "17.0" }
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "5.0"            # Swift 6 compiler, Swift 5 language mode (AVFoundation delegates)
    SWIFT_STRICT_CONCURRENCY: targeted
    MARKETING_VERSION: "0.2.1"      # bump by hand per release; the build number is git's commit count
    CURRENT_PROJECT_VERSION: "1"
    DEVELOPMENT_TEAM: ""            # dev device builds pass DEVELOPMENT_TEAM=<id> on the command line
    CODE_SIGN_STYLE: Automatic
targets:
  Lark:
    type: application
    platform: iOS
    sources: [Sources]
    info:
      path: Sources/App/Info.plist
      properties:
        CFBundleDisplayName: Melarka
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        UILaunchScreen: {}
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        UIBackgroundModes: [audio, fetch, processing]
        BGTaskSchedulerPermittedIdentifiers: [io.github.aaronsuns.melarka.refresh]
        ITSAppUsesNonExemptEncryption: false
        NSAppTransportSecurity: { NSAllowsLocalNetworking: true }   # http://*.local and localhost, for development servers
        NSLocalNetworkUsageDescription: Connects to a Melarka server on your local network, for development   # translated in InfoPlist.xcstrings
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: io.github.aaronsuns.melarka
        TARGETED_DEVICE_FAMILY: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
  LarkTests:
    type: bundle.unit-test
    platform: iOS
    sources: [Tests]
    dependencies: [{ target: Lark }]
    settings:
      base:
        TEST_HOST: $(BUILT_PRODUCTS_DIR)/Lark.app/$(BUNDLE_EXECUTABLE_FOLDER_PATH)/Lark
        BUNDLE_LOADER: $(TEST_HOST)
        GENERATE_INFOPLIST_FILE: YES
schemes:
  Lark:
    build: { targets: { Lark: all, LarkTests: [test] } }
    test: { targets: [LarkTests], gatherCoverageData: false }
    archive: { config: Release }
